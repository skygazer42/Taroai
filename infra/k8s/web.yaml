apiVersion: apps/v1
kind: Deployment
metadata:
  name: taroai-web
  labels:
    app.kubernetes.io/name: taroai-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: taroai
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: taroai-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taroai-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: taroai
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/creao-ai/taroai-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: taroai-web
  labels:
    app.kubernetes.io/name: taroai-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: taroai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: taroai-web
  ports:
    - name: http
      port: 80
      targetPort: http
