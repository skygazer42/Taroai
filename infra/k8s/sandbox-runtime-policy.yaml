apiVersion: v1
kind: Namespace
metadata:
  name: taroai
  labels:
    app.kubernetes.io/name: taroai
    app.kubernetes.io/part-of: taroai
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: taroai-sandbox-runtime-quota
  namespace: taroai
  labels:
    app.kubernetes.io/name: taroai-sandbox-runtime
    app.kubernetes.io/component: sandbox-runtime
    app.kubernetes.io/part-of: taroai
spec:
  hard:
    pods: "50"
    requests.cpu: "20"
    requests.memory: "40Gi"
    limits.cpu: "40"
    limits.memory: "80Gi"
    requests.ephemeral-storage: "100Gi"
    limits.ephemeral-storage: "200Gi"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: taroai-sandbox-runtime-limits
  namespace: taroai
  labels:
    app.kubernetes.io/name: taroai-sandbox-runtime
    app.kubernetes.io/component: sandbox-runtime
    app.kubernetes.io/part-of: taroai
spec:
  limits:
    - type: Container
      default:
        cpu: "1000m"
        memory: "1Gi"
        ephemeral-storage: "2Gi"
      defaultRequest:
        cpu: "500m"
        memory: "512Mi"
        ephemeral-storage: "1Gi"
      max:
        cpu: "2000m"
        memory: "4Gi"
        ephemeral-storage: "8Gi"
      min:
        cpu: "100m"
        memory: "128Mi"
        ephemeral-storage: "256Mi"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: taroai-sandbox-runtime-default-deny
  namespace: taroai
  labels:
    app.kubernetes.io/name: taroai-sandbox-runtime
    app.kubernetes.io/component: sandbox-runtime
    app.kubernetes.io/part-of: taroai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: taroai-sandbox-session
  policyTypes:
    - Ingress
    - Egress
