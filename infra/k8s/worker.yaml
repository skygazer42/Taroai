apiVersion: apps/v1
kind: Deployment
metadata:
  name: taroai-agent-worker
  labels:
    app.kubernetes.io/name: taroai-agent-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: taroai
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: taroai-agent-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: taroai-agent-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: taroai
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-worker
          image: ghcr.io/creao-ai/taroai-api:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "taroai.workers.runner"]
          args:
            - "--worker-kind"
            - "agent"
            - "--loop-forever"
            - "--poll-interval-seconds"
            - "1"
            - "--stop-after-empty-polls"
            - "1"
          envFrom:
            - configMapRef:
                name: taroai-runtime-config
            - secretRef:
                name: taroai-runtime-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: taroai-data
              mountPath: /data/taroai
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
        - name: taroai-data
          emptyDir: {}
---
