apiVersion: v1
kind: Secret
metadata:
  name: taroai-runtime-secrets
  labels:
    app.kubernetes.io/name: taroai-runtime
    app.kubernetes.io/part-of: taroai
type: Opaque
stringData:
  POSTGRES_PASSWORD: "replace-with-postgres-admin-password"
  TAROAI_APP_DATABASE_PASSWORD: "replace-with-database-password"
  TAROAI_DATABASE_URL: "postgresql://taroai_app:replace-with-database-password@postgres:5432/taroai"
  REDIS_PASSWORD: "replace-with-redis-password"
  TAROAI_REDIS_URL: "redis://:replace-with-redis-password@redis:6379/0"
  MINIO_ROOT_USER: "replace-with-minio-root-user"
  MINIO_ROOT_PASSWORD: "replace-with-minio-root-password"
  TAROAI_OBJECT_STORAGE_ACCESS_KEY_ID: "replace-with-minio-root-user"
  TAROAI_OBJECT_STORAGE_SECRET_ACCESS_KEY: "replace-with-minio-root-password"
  TAROAI_MODEL_GATEWAY_API_KEY: "replace-with-model-gateway-key"
  TAROAI_SANDBOX_CONTROLLER_API_KEY: "replace-with-sandbox-controller-key"
  TAROAI_SANDBOX_SECRET_RESOLVER_TOKEN: "replace-with-sandbox-resolver-token"
  TAROAI_BROWSER_CONTROLLER_API_KEY: "replace-with-browser-controller-key"
  TAROAI_ACCESS_TOKEN_SECRET: "replace-with-access-token-secret"
  TAROAI_PASSWORD_HASH_SALT: "replace-with-password-hash-salt"
  TAROAI_TENANT_BOOTSTRAP_TOKEN: "replace-with-bootstrap-token"
  TAROAI_TRIGGER_WEBHOOK_SIGNING_SECRETS: "[\"replace-with-webhook-signing-secret\"]"
