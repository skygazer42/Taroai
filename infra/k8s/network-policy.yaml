apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: taroai-default-deny
  labels:
    app.kubernetes.io/name: taroai-network-policy
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: taroai
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: taroai-allow-dns-egress
  labels:
    app.kubernetes.io/name: taroai-network-policy
    app.kubernetes.io/component: network-policy
    app.kubernetes.io/part-of: taroai
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: taroai-api-ingress
  labels:
    app.kubernetes.io/name: taroai-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: taroai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: taroai-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: taroai
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: taroai-api-egress
  labels:
    app.kubernetes.io/name: taroai-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: taroai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
      ports:
        - protocol: TCP
          port: 9000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sandbox-controller
      ports:
        - protocol: TCP
          port: 8002
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: browser-controller
      ports:
        - protocol: TCP
          port: 8001
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
---
