          port: 443
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "taroai.fullname" . }}-migration-egress
  labels:
    {{- include "taroai.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "taroai.fullname" . }}-db-migrate
    app.kubernetes.io/component: migration
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: migration
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.postgresql.serviceName }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgresql.port }}
