{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "taroai.serviceAccountName" . }}
  labels:
    {{- include "taroai.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "taroai.fullname" . }}
    app.kubernetes.io/component: service-account
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
