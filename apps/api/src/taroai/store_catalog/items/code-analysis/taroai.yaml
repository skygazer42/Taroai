{
  "metadata": {
    "id": "taroai.code-analysis",
    "version": "1.0.0",
    "owner": "taroai/development"
  },
  "spec": {
    "type": "data_skill",
    "inputSchema": {
      "type": "object",
      "properties": {
        "goal": {"type": "string"},
